spring.datasource.url=jdbc:mysql://localhost:3306/orabackend
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
styleora.jwt.secret=${JWT_SECRET:StyleoraJwtSecretKeyForSigningTokens1234567890}
styleora.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
server.error.include-message=always
server.error.include-binding-errors=always
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://localhost:55251,http://localhost:57053,http://localhost:58552,http://localhost:55720}
styleora.seed.sample.enabled=${SEED_SAMPLE_ENABLED:false}
styleora.seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
