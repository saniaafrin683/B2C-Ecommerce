<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="p-4 bg-white rounded shadow-sm">
      <h2>{{ title }}</h2>
      <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
      <form #authForm="ngForm" (ngSubmit)="submit()" novalidate>
        <div class="mb-3" *ngIf="mode === 'register'">
          <label class="form-label">Full name</label>
          <input
            type="text"
            class="form-control"
            name="fullName"
            [(ngModel)]="formData.fullName"
            required
            minlength="2"
            placeholder="Your full name">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            name="email"
            [(ngModel)]="formData.email"
            required
            email
            placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            name="password"
            [(ngModel)]="formData.password"
            required
            minlength="6"
            placeholder="Password">
        </div>
        <ng-container *ngIf="mode === 'register'">
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" name="phone" [(ngModel)]="formData.phone" placeholder="Phone number">
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" rows="3" name="address" [(ngModel)]="formData.address" placeholder="Address"></textarea>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">City</label>
              <input type="text" class="form-control" name="city" [(ngModel)]="formData.city" placeholder="City">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Country</label>
              <input type="text" class="form-control" name="country" [(ngModel)]="formData.country" placeholder="Country">
            </div>
          </div>
        </ng-container>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting || authForm.invalid">
          {{ isSubmitting ? 'Please wait...' : submitLabel }}
        </button>
        <p class="mt-3 mb-0 text-muted" *ngIf="mode === 'login'">
          Need an account?
          <a routerLink="/register">Register</a>
        </p>
        <p class="mt-3 mb-0 text-muted" *ngIf="mode === 'register'">
          Already have an account?
          <a routerLink="/login">Login</a>
        </p>
      </form>
    </div>
  </div>
</div>
