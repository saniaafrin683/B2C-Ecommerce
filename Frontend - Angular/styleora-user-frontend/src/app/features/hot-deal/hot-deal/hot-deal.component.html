<div class="container py-5">

  <!-- Title -->
  <div class="mb-4">
    <h2 class="fw-bold">Hot Deals 🔥</h2>
    <p class="text-muted">Best discounted products for you</p>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-dark"></div>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <!-- Empty -->
  <div *ngIf="!isLoading && !hotDeals.length" class="text-center py-5">
    <p>No hot deals available right now.</p>
  </div>

  <!-- GRID -->
  <div class="row g-4" *ngIf="!isLoading && hotDeals.length">

    <div class="col-6 col-md-4 col-lg-3" *ngFor="let product of hotDeals">
      <app-product-card [product]="product"></app-product-card>
    </div>

  </div>

</div>
