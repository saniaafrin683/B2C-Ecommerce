<div class="admin-page">
  <div class="admin-page-header">
    <div>
      <span class="admin-page-eyebrow">Returns / Edit</span>
      <h1 class="admin-page-title">Edit Return Request</h1>
      <p class="admin-page-subtitle">Update the return decision, customer reason, or refund workflow remarks.</p>
    </div>
  </div>

  <section class="section-card surface-card glass-panel">
    <div *ngIf="errorMessage" class="page-message error">{{ errorMessage }}</div>
    <div *ngIf="loading" class="page-message info">Loading return request...</div>

    <form class="form-shell" *ngIf="!loading" (ngSubmit)="onSave()">
      <div class="admin-form-grid row">
        <div class="col-md-6 admin-field">
          <label class="admin-form-label">Order ID</label>
          <input class="admin-input" type="number" [(ngModel)]="returnRequestForm.orderId" name="orderId" readonly>
        </div>

        <div class="col-md-6 admin-field">
          <label class="admin-form-label">Customer ID</label>
          <input class="admin-input" type="number" [(ngModel)]="returnRequestForm.customerId" name="customerId" readonly>
        </div>

        <div class="col-12 admin-field">
          <label class="admin-form-label">Reason</label>
          <textarea class="admin-textarea" rows="4" [(ngModel)]="returnRequestForm.reason" name="reason" readonly></textarea>
        </div>

        <div class="col-md-6 admin-field">
          <label class="admin-form-label">Status</label>
          <select class="admin-select" [(ngModel)]="returnRequestForm.status" name="status" required>
            <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
          </select>
        </div>

        <div class="col-12 admin-field">
          <label class="admin-form-label">Note</label>
          <textarea class="admin-textarea" rows="4" [(ngModel)]="returnRequestForm.note" name="note"></textarea>
        </div>
      </div>

      <div class="admin-form-actions">
        <button type="submit" class="btn-ui" [disabled]="submitting">{{ submitting ? 'Saving...' : 'Save' }}</button>
        <button type="button" class="btn-ui-secondary" (click)="onReset()">Reset</button>
        <button type="button" class="btn-ui-ghost" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </section>
</div>
