<div class="category-create-page admin-page form-shell">
  <div class="page-header admin-page-header">
    <div class="page-title-block">
      <span class="admin-page-eyebrow">Taxonomy workflow</span>
      <h1 class="admin-page-title">Create Category</h1>
      <p class="admin-page-subtitle">Add a new category, upload a thumbnail, and define stock and metadata with the same admin design system.</p>
    </div>

    <div class="page-actions admin-actions">
      <button type="button" class="btn-ui-secondary cancel-top-btn" (click)="onCancel()">
        Cancel
      </button>
    </div>
  </div>

  <form (ngSubmit)="onSave()" #categoryNgForm="ngForm">
    <div class="row">
      <div class="col-lg-4">
        <div class="category-card upload-card">
          <h4>Add Thumbnail Photo</h4>

          <label for="categoryImage" class="upload-box">
            <div class="upload-content">
              <div class="upload-icon">
                <i class="bi bi-cloud-arrow-up"></i>
              </div>

              <h5>Drop your image here, or click to browse</h5>
              <p>1600 x 1200 (4:3) recommended. PNG, JPG and GIF files are allowed.</p>

              <span class="btn-ui browse-btn">Browse Image</span>
            </div>

            <input
              id="categoryImage"
              type="file"
              accept="image/*"
              (change)="onFileSelected($event)"
              hidden>
          </label>

          <div class="file-name" *ngIf="selectedFileName">
            Selected: {{ selectedFileName }}
          </div>

          <div class="image-preview" *ngIf="categoryForm.imageUrl">
            <img
              [src]="categoryForm.imageUrl"
              alt="Category Preview"
              (error)="categoryForm.imageUrl = 'assets/images/category/default-product.png'">
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="category-card form-card admin-form-section">
          <div class="section-card-header">
            <div>
              <h4 class="section-card-title">General Information</h4>
              <p class="section-card-subtitle">Use the same field rhythm and button sizing as the rest of the admin forms.</p>
            </div>
          </div>

          <div class="row admin-form-grid">
            <div class="col-md-12 admin-field">
              <label>Category Title</label>
              <input
                type="text"
                class="form-control"
                name="categoryTitle"
                [(ngModel)]="categoryForm.categoryTitle"
                required
                placeholder="Enter category title">
              <div class="admin-validation-msg"></div>
            </div>

            <div class="col-md-6 admin-field">
              <label>Created By</label>
              <select
                class="form-control"
                name="createdBy"
                [(ngModel)]="categoryForm.createdBy"
                required>
                <option value="">Select Creator</option>
                <option *ngFor="let option of createdByOptions" [value]="option">
                  {{ option }}
                </option>
              </select>
              <div class="admin-validation-msg"></div>
            </div>

            <div class="col-md-6 admin-field">
              <label>Stock</label>
              <input
                type="number"
                class="form-control"
                name="stock"
                [(ngModel)]="categoryForm.stock"
                placeholder="Enter stock quantity">
              <div class="admin-validation-msg"></div>
            </div>

            <div class="col-md-12 admin-field">
              <label>Tag ID</label>
              <input
                type="text"
                class="form-control"
                name="tagId"
                [(ngModel)]="categoryForm.tagId"
                placeholder="Enter category tag id">
              <div class="admin-validation-msg"></div>
            </div>

            <div class="col-md-12 admin-field">
              <label>Description</label>
              <textarea
                rows="5"
                class="form-control"
                name="description"
                [(ngModel)]="categoryForm.description"
                placeholder="Write category description"></textarea>
              <div class="admin-validation-msg"></div>
            </div>
          </div>

          <div class="form-actions admin-form-actions">
            <button type="submit" class="btn-ui save-btn" [disabled]="submitting">
              {{ submitting ? 'Saving...' : 'Save' }}
            </button>

            <button type="button" class="btn-ui-secondary reset-btn" (click)="onReset()">
              Reset
            </button>

            <button type="button" class="btn-ui-ghost cancel-btn" (click)="onCancel()">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
