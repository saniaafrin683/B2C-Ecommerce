<div class="admin-page">
  <div class="admin-page-header">
    <div>
      <span class="admin-page-eyebrow">Roles / Create</span>
      <h1 class="admin-page-title">Create Role</h1>
      <p class="admin-page-subtitle">Add a new role definition for admin panel user assignment.</p>
    </div>
  </div>

  <section class="section-card surface-card glass-panel">
    <div *ngIf="errorMessage" class="page-message error">{{ errorMessage }}</div>

    <form class="form-shell" (ngSubmit)="onSave()">
      <div class="admin-form-grid row">
        <div class="col-md-6 admin-field">
          <label class="admin-form-label">Role Name</label>
          <input class="admin-input" type="text" [(ngModel)]="roleForm.name" name="name" required>
        </div>

        <div class="col-md-6 admin-field">
          <label class="admin-form-label">Status</label>
          <select class="admin-select" [(ngModel)]="roleForm.status" name="status" required>
            <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
          </select>
        </div>

        <div class="col-12 admin-field">
          <label class="admin-form-label">Description</label>
          <textarea class="admin-textarea" rows="4" [(ngModel)]="roleForm.description" name="description"></textarea>
        </div>
      </div>

      <div class="admin-form-actions">
        <button type="submit" class="btn-ui" [disabled]="submitting">{{ submitting ? 'Saving...' : 'Save' }}</button>
        <button type="button" class="btn-ui-secondary" (click)="onReset()">Reset</button>
        <button type="button" class="btn-ui-ghost" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </section>
</div>
